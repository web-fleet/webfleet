name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      WEBFLEET_AUDIT_TEST_ALLOW_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/webfleet
  race:
    runs-on: ubuntu-latest
    env:
      WEBFLEET_AUDIT_TEST_ALLOW_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: go test -race ./...
  crosscompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-compile the supported matrix
        run: |
          set -e
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o "/tmp/wf-$os-$arch" ./cmd/webfleet
          done
  release-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release matrix and checksums
        run: |
          scripts/release.sh
      - name: Verify the release tree (read-only)
        run: |
          scripts/verify-release.sh dist
      - name: Attest build provenance for the archives (dry-run; no Release is created)
        if: ${{ github.event_name == 'push' }}
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/webfleet_*_linux_amd64.tar.gz,dist/webfleet_*_linux_arm64.tar.gz,dist/webfleet_*_darwin_amd64.tar.gz,dist/webfleet_*_darwin_arm64.tar.gz,dist/webfleet_*_windows_amd64.zip,dist/webfleet_*_windows_arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: webfleet-release
          path: dist/*
          if-no-files-found: error
  systemd-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the binary under test
        run: CGO_ENABLED=0 go build -o /tmp/wf ./cmd/webfleet
      - name: Rehearse the systemd lifecycle (install -> healthz -> update -> rollback -> uninstall)
        run: |
          set -euxo pipefail
          DATA=/var/lib/webfleet
          # The first start runs migrations before binding the listener, so the
          # healthz check must tolerate startup (bounded poll, not a single
          # immediate curl).
          wait_healthz() {
            for _ in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8090/healthz | grep -q '"ok":true'; then
                return 0
              fi
              sleep 0.5
            done
            echo "healthz never became ready" >&2
            curl -v http://127.0.0.1:8090/healthz 2>&1 | tail -3 || true
            return 1
          }
          sudo /tmp/wf service install
          # account and data ownership are created by install
          id webfleet
          sudo test -O "$DATA" -o "$(stat -c %U "$DATA")" = webfleet || exit 1
          systemctl is-active webfleet.service
          wait_healthz
          # install is idempotent
          sudo /tmp/wf service install
          wait_healthz
          # update with a verified artifact
          CGO_ENABLED=0 go build -o /tmp/wf2 ./cmd/webfleet
          SHA=$(sha256sum /tmp/wf2 | cut -d' ' -f1)
          sudo /tmp/wf service update /tmp/wf2 "$SHA"
          wait_healthz
          # rollback restores the previous executable
          sudo /tmp/wf service rollback
          wait_healthz
          # uninstall removes the unit; data is preserved
          sudo /tmp/wf service uninstall
          test ! -f /etc/systemd/system/webfleet.service
          sudo test -d "$DATA"
      - name: Rehearse partial-failure rollback (deterministic activation failure)
        run: |
          set -euxo pipefail
          # Deterministic failure injection: a fake systemctl that fails the
          # enable --now activation step. Install must roll back cleanly.
          mkdir -p /tmp/fakebin
          cat > /tmp/fakebin/systemctl <<'EOF'
          #!/bin/sh
          case "$*" in
            *"enable --now"*) echo "simulated activation failure" >&2; exit 1 ;;
            *) exit 0 ;;
          esac
          EOF
          chmod +x /tmp/fakebin/systemctl
          set +e
          sudo env "PATH=/tmp/fakebin:/usr/bin:/bin" /tmp/wf service install > /tmp/install-fail.log 2>&1
          rc=$?
          set -e
          [ "$rc" -ne 0 ] || { echo "install with failing activation succeeded unexpectedly" >&2; exit 1; }
          grep -q "rolled back" /tmp/install-fail.log || { echo "install did not report rollback" >&2; cat /tmp/install-fail.log >&2; exit 1; }
          test ! -f /etc/systemd/system/webfleet.service || { echo "unit left behind after rollback" >&2; exit 1; }
          # The previously installed binary must be restored; user data untouched.
          cmp /tmp/wf /usr/local/bin/webfleet || { echo "binary not restored after rollback" >&2; exit 1; }
          sudo test -d /var/lib/webfleet
          # Installation can then be repeated successfully.
          sudo /tmp/wf service install
          curl -fsS http://127.0.0.1:8090/healthz | grep '"ok":true'
          sudo /tmp/wf service uninstall || true
          # Second branch: no pre-existing binary. Remove it, then the same
          # failing activation must remove the newly copied binary too.
          sudo rm -f /usr/local/bin/webfleet
          set +e
          sudo env "PATH=/tmp/fakebin:/usr/bin:/bin" /tmp/wf service install > /tmp/install-fail2.log 2>&1
          rc=$?
          set -e
          [ "$rc" -ne 0 ] || { echo "no-binary install with failing activation succeeded unexpectedly" >&2; exit 1; }
          grep -q "rolled back" /tmp/install-fail2.log || { echo "no-binary install did not report rollback" >&2; exit 1; }
          test ! -f /etc/systemd/system/webfleet.service || { echo "unit left behind after no-binary rollback" >&2; exit 1; }
          test ! -f /usr/local/bin/webfleet || { echo "newly copied binary not removed after no-binary rollback" >&2; exit 1; }
          sudo test -d /var/lib/webfleet
          # A normal install then succeeds again.
          sudo /tmp/wf service install
          curl -fsS http://127.0.0.1:8090/healthz | grep '"ok":true'
          sudo /tmp/wf service uninstall || true