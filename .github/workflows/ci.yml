name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      WEBFLEET_AUDIT_TEST_ALLOW_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/webfleet
  action-pins:
    # Repository-level policy gate. Runs once on Ubuntu (not inside the three-OS
    # test matrix) and provisions the scanner's YAML dependency explicitly; the
    # scanner fails closed if it is unavailable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install action-pin scanner dependency
        run: python -m pip install --require-hashes -r .github/workflows/requirements-action-pins.txt
      - name: Action pins
        run: ./scripts/action-pins.sh
      - name: Action pins negative and positive tests
        run: ./scripts/test-action-pins.sh
  race:
    runs-on: ubuntu-latest
    env:
      WEBFLEET_AUDIT_TEST_ALLOW_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: go test -race ./...
  crosscompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-compile the supported matrix
        run: |
          set -e
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o "/tmp/wf-$os-$arch" ./cmd/webfleet
          done
  release-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release matrix and checksums (release.yml contract)
        run: |
          scripts/build-release.sh v0.0.0 dist
      - name: Verify the release tree (read-only)
        run: |
          (cd dist && sha256sum -c checksums.txt)
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: webfleet-release
          path: dist/*
          if-no-files-found: error
  systemd-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the binary under test
        run: CGO_ENABLED=0 go build -o /tmp/wf ./cmd/webfleet
      - name: Rehearse the systemd lifecycle (install -> healthz -> update -> rollback -> uninstall)
        run: |
          set -euxo pipefail
          DATA=/var/lib/webfleet
          # The first start runs migrations before binding the listener, so the
          # healthz check must tolerate startup (bounded poll, not a single
          # immediate curl).
          wait_healthz() {
            for _ in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:7336/healthz | grep -q '"ok":true'; then
                return 0
              fi
              sleep 0.5
            done
            echo "healthz never became ready" >&2
            curl -v http://127.0.0.1:7336/healthz 2>&1 | tail -3 || true
            return 1
          }
          sudo /tmp/wf service install
          # account and data ownership are created by install
          id webfleet
          sudo test -O "$DATA" -o "$(stat -c %U "$DATA")" = webfleet || exit 1
          systemctl is-active webfleet.service
          wait_healthz
          # The default install records the explicit --host/--port pair
          # (127.0.0.1:7336) in ExecStart with the explicit listen-mode marker,
          # so the runtime listener survives restart/reboot.
          grep -q 'ExecStart=/usr/local/bin/webfleet "--host" "127.0.0.1" "--port" "7336"' /etc/systemd/system/webfleet.service
          grep -q '# webfleet-listen-mode: explicit' /etc/systemd/system/webfleet.service
          /tmp/wf service status | grep -E 'listen: *127.0.0.1:7336'
          # install is idempotent (byte-identical + enabled + active -> no-op)
          sudo /tmp/wf service install
          wait_healthz
          # start/stop/restart/status/enable/disable family
          sudo /tmp/wf service status | grep -E 'active: *active'
          sudo /tmp/wf service status | grep -E 'enabled: *enabled'
          /tmp/wf service status | grep -E 'health:  ok'   # status is read-only, no sudo
          sudo /tmp/wf service stop
          sudo /tmp/wf service stop   # repeated stop is safe
          sudo /tmp/wf service start
          wait_healthz
          sudo /tmp/wf service restart
          wait_healthz
          sudo /tmp/wf service disable
          sudo /tmp/wf service disable   # repeated disable is safe
          test "$(systemctl is-enabled webfleet.service)" = disabled
          sudo /tmp/wf service enable
          test "$(systemctl is-enabled webfleet.service)" = enabled
          # idempotent reinstall while enabled+active
          sudo /tmp/wf service install
          wait_healthz
          # prior disabled+stopped state is faithfully preserved across reinstall
          sudo /tmp/wf service stop
          sudo /tmp/wf service disable
          sudo /tmp/wf service install
          test "$(systemctl is-enabled webfleet.service)" = disabled
          test "$(systemctl is-active webfleet.service)" = inactive
          sudo /tmp/wf service enable
          sudo /tmp/wf service start
          wait_healthz
          # --- reinstall state-preservation matrix (changed unit via a new data path) ---
          # enabled+active preserved
          sudo /tmp/wf service install --data /var/lib/webfleet-m2
          test "$(systemctl is-enabled webfleet.service)" = enabled
          test "$(systemctl is-active webfleet.service)" = active
          wait_healthz
          # enabled+inactive preserved
          sudo /tmp/wf service stop
          sudo /tmp/wf service install --data /var/lib/webfleet-m3
          test "$(systemctl is-enabled webfleet.service)" = enabled
          test "$(systemctl is-active webfleet.service)" = inactive
          # disabled+active preserved
          sudo /tmp/wf service start
          wait_healthz
          sudo /tmp/wf service disable
          test "$(systemctl is-enabled webfleet.service)" = disabled
          test "$(systemctl is-active webfleet.service)" = active
          sudo /tmp/wf service install --data /var/lib/webfleet-m4
          test "$(systemctl is-enabled webfleet.service)" = disabled
          test "$(systemctl is-active webfleet.service)" = active
          wait_healthz
          # disabled+inactive preserved (genuine changed reinstall, not just a no-op)
          sudo /tmp/wf service stop
          sudo /tmp/wf service install --data /var/lib/webfleet-m5
          test "$(systemctl is-enabled webfleet.service)" = disabled
          test "$(systemctl is-active webfleet.service)" = inactive
          # --- custom data path and dangerous-path adoption ---
          # custom safe data path is created and assigned to the service account; the
          # service is currently disabled+inactive (preserved state), so start it
          # and verify it runs from the safe data directory.
          sudo /tmp/wf service install --data /var/lib/webfleet-safe
          test "$(stat -c %U /var/lib/webfleet-safe)" = webfleet || exit 1
          sudo /tmp/wf service start
          wait_healthz
          # dangerous system roots and relative paths are refused without mutation
          for bad in / /etc /usr /var /tmp; do
            if sudo /tmp/wf service install --data "$bad" >/tmp/bad-install.log 2>&1; then
              echo "install accepted dangerous data path $bad" >&2
              exit 1
            fi
          done
          if sudo /tmp/wf service install --data relative/data >/tmp/rel-install.log 2>&1; then
            echo "install accepted a relative data path" >&2
            exit 1
          fi
          test -f /etc/systemd/system/webfleet.service || { echo "dangerous-path refusal removed the unit" >&2; exit 1; }
          # an existing root-owned directory is refused rather than adopted
          sudo mkdir -p /var/lib/webfleet-foreign
          if sudo /tmp/wf service install --data /var/lib/webfleet-foreign >/tmp/foreign-install.log 2>&1; then
            echo "install adopted a root-owned existing directory" >&2
            exit 1
          fi
          sudo rm -rf /var/lib/webfleet-foreign
          # restore the canonical data dir and enabled+active for the update section
          sudo /tmp/wf service install --data /var/lib/webfleet
          sudo /tmp/wf service enable
          sudo /tmp/wf service start
          wait_healthz
          # --- explicit --host/--port install ---
          # An explicit listener is recorded in ExecStart and governs the
          # runtime bind (status + healthz use it); a reinstall preserves the
          # explicit mode.
          sudo /tmp/wf service install --host 127.0.0.1 --port 7337
          grep -q 'ExecStart=/usr/local/bin/webfleet "--host" "127.0.0.1" "--port" "7337"' /etc/systemd/system/webfleet.service
          grep -q '# webfleet-listen-mode: explicit' /etc/systemd/system/webfleet.service
          /tmp/wf service status | grep -E 'listen: *127.0.0.1:7337'
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:7337/healthz | grep -q '"ok":true' && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:7337/healthz | grep -q '"ok":true'
          # --- legacy --listen install (bootstrap mode preserved) ---
          sudo /tmp/wf service install --listen 127.0.0.1:8091
          grep -q 'Environment=WEBFLEET_LISTEN="127.0.0.1:8091"' /etc/systemd/system/webfleet.service
          grep -q '# webfleet-listen-mode: bootstrap' /etc/systemd/system/webfleet.service
          /tmp/wf service status | grep -E 'listen: *127.0.0.1:8091'
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8091/healthz | grep -q '"ok":true' && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:8091/healthz | grep -q '"ok":true'
          # a bare reinstall preserves the existing bootstrap listener
          sudo /tmp/wf service install
          /tmp/wf service status | grep -E 'listen: *127.0.0.1:8091'
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8091/healthz | grep -q '"ok":true' && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:8091/healthz | grep -q '"ok":true'
          # restore the canonical explicit default (127.0.0.1:7336) for the update section
          sudo /tmp/wf service install --host 127.0.0.1 --port 7336
          grep -q 'ExecStart=/usr/local/bin/webfleet "--host" "127.0.0.1" "--port" "7336"' /etc/systemd/system/webfleet.service
          grep -q '# webfleet-listen-mode: explicit' /etc/systemd/system/webfleet.service
          /tmp/wf service status | grep -E 'listen: *127.0.0.1:7336'
          sudo /tmp/wf service start
          wait_healthz
          # update with a verified artifact
          CGO_ENABLED=0 go build -o /tmp/wf2 ./cmd/webfleet
          SHA=$(sha256sum /tmp/wf2 | cut -d' ' -f1)
          sudo /tmp/wf service update /tmp/wf2 "$SHA"
          wait_healthz
          # rollback restores the previous executable
          sudo /tmp/wf service rollback
          wait_healthz
          # a deliberately stopped service stays stopped across update and rollback
          sudo /tmp/wf service stop
          CGO_ENABLED=0 go build -o /tmp/wf4 ./cmd/webfleet
          SHA4=$(sha256sum /tmp/wf4 | cut -d' ' -f1)
          sudo /tmp/wf service update /tmp/wf4 "$SHA4"
          test "$(systemctl is-active webfleet.service)" = inactive
          sudo /tmp/wf service rollback
          test "$(systemctl is-active webfleet.service)" = inactive
          # stop -> uninstall removes the unit; data is preserved; repeat is a no-op
          sudo /tmp/wf service stop
          sudo /tmp/wf service uninstall
          test ! -f /etc/systemd/system/webfleet.service
          sudo /tmp/wf service uninstall   # idempotent no-op
          test ! -f /etc/systemd/system/webfleet.service
          sudo test -d "$DATA"
      - name: Rate-limit a persistent crash loop (finite limiter + deliberate reset)
        run: |
          set -euxo pipefail
          # A persistently crashing service must be stopped by the finite unit
          # policy (StartLimitIntervalSec=60, StartLimitBurst=5), not restarted
          # forever; a deliberate CLI start then clears the accumulated limit
          # via reset-failed and recovers normally.
          wait_healthz() {
            for _ in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:7336/healthz | grep -q '"ok":true'; then
                return 0
              fi
              sleep 0.5
            done
            echo "healthz never became ready" >&2
            return 1
          }
          sudo /tmp/wf service install --host 127.0.0.1 --port 7336
          wait_healthz
          grep -q 'StartLimitIntervalSec=60' /etc/systemd/system/webfleet.service
          grep -q 'StartLimitBurst=5' /etc/systemd/system/webfleet.service
          grep -qv 'StartLimitIntervalSec=0' /etc/systemd/system/webfleet.service
          # Swap in an entrypoint that always exits 1 and restart manually (no
          # CLI reset) so the crash loop accumulates toward the finite limit.
          printf '#!/bin/sh\nexit 1\n' | sudo tee /tmp/wf-crash-entry >/dev/null
          sudo chmod +x /tmp/wf-crash-entry
          sudo mv /tmp/wf-crash-entry /usr/local/bin/webfleet
          sudo systemctl restart webfleet.service
          rate_limited=0
          for _ in $(seq 1 25); do
            if [ "$(systemctl show webfleet.service -p ActiveState --value)" = failed ]; then
              rate_limited=1
              break
            fi
            sleep 1
          done
          [ "$rate_limited" -eq 1 ] || { echo "crash loop was never rate-limited" >&2; systemctl status webfleet.service --no-pager -l; exit 1; }
          n1=$(systemctl show webfleet.service -p NRestarts --value)
          sleep 6
          n2=$(systemctl show webfleet.service -p NRestarts --value)
          [ "$n1" = "$n2" ] || { echo "crash loop resumed after rate-limit" >&2; exit 1; }
          # A deliberate CLI start clears the accumulated limit and recovers.
          sudo cp /tmp/wf /usr/local/bin/webfleet
          sudo /tmp/wf service start
          wait_healthz
          sudo /tmp/wf service uninstall || true
      - name: Rehearse partial-failure rollback (deterministic activation failure)
        run: |
          set -euxo pipefail
          # Deterministic failure injection: a fake systemctl that fails the
          # activation step (fresh installs `start`, reinstalls `restart`).
          # Install must roll back cleanly. First start runs migrations before
          # binding, so poll healthz.
          wait_healthz() {
            for _ in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:7336/healthz | grep -q '"ok":true'; then
                return 0
              fi
              sleep 0.5
            done
            echo "healthz never became ready" >&2
            return 1
          }
          mkdir -p /tmp/fakebin
          cat > /tmp/fakebin/systemctl <<'EOF'
          #!/bin/sh
          case "$*" in
            "start webfleet.service"|"restart webfleet.service") echo "simulated activation failure" >&2; exit 1 ;;
            *) exit 0 ;;
          esac
          EOF
          chmod +x /tmp/fakebin/systemctl
          set +e
          sudo env "PATH=/tmp/fakebin:/usr/sbin:/usr/bin:/bin" /tmp/wf service install > /tmp/install-fail.log 2>&1
          rc=$?
          set -e
          [ "$rc" -ne 0 ] || { echo "install with failing activation succeeded unexpectedly" >&2; exit 1; }
          grep -q "rolled back" /tmp/install-fail.log || { echo "install did not report rollback" >&2; cat /tmp/install-fail.log >&2; exit 1; }
          test ! -f /etc/systemd/system/webfleet.service || { echo "unit left behind after rollback" >&2; exit 1; }
          # The previously installed binary must be restored; user data untouched.
          cmp /tmp/wf /usr/local/bin/webfleet || { echo "binary not restored after rollback" >&2; exit 1; }
          sudo test -d /var/lib/webfleet
          # Installation can then be repeated successfully.
          sudo /tmp/wf service install
          wait_healthz
          sudo /tmp/wf service uninstall || true
          # Second branch: no pre-existing binary. Remove it, then the same
          # failing activation must remove the newly copied binary too.
          sudo rm -f /usr/local/bin/webfleet
          set +e
          sudo env "PATH=/tmp/fakebin:/usr/sbin:/usr/bin:/bin" /tmp/wf service install > /tmp/install-fail2.log 2>&1
          rc=$?
          set -e
          [ "$rc" -ne 0 ] || { echo "no-binary install with failing activation succeeded unexpectedly" >&2; exit 1; }
          grep -q "rolled back" /tmp/install-fail2.log || { echo "no-binary install did not report rollback" >&2; exit 1; }
          test ! -f /etc/systemd/system/webfleet.service || { echo "unit left behind after no-binary rollback" >&2; exit 1; }
          test ! -f /usr/local/bin/webfleet || { echo "newly copied binary not removed after no-binary rollback" >&2; exit 1; }
          sudo test -d /var/lib/webfleet
          # A normal install then succeeds again.
          sudo /tmp/wf service install
          wait_healthz
          sudo /tmp/wf service uninstall || true
          # Third branch: rollback failure is reported, not silently claimed.
          # A fake systemctl that fails daemon-reload forces BOTH the forward
          # install (daemon-reload is the first step) and the rollback reload to
          # fail, so the returned error must combine both failures.
          sudo /tmp/wf service install
          wait_healthz
          mkdir -p /tmp/fakebin2
          cat > /tmp/fakebin2/systemctl <<'EOF'
          #!/bin/sh
          case "$*" in
            *daemon-reload*) echo "simulated daemon-reload failure" >&2; exit 1 ;;
            "is-enabled webfleet.service") echo "enabled" ;;
            "is-active webfleet.service") echo "active" ;;
            *) exit 0 ;;
          esac
          EOF
          chmod +x /tmp/fakebin2/systemctl
          set +e
          sudo env "PATH=/tmp/fakebin2:/usr/sbin:/usr/bin:/bin" /tmp/wf service install --listen 127.0.0.1:8091 > /tmp/install-fail3.log 2>&1
          rc=$?
          set -e
          [ "$rc" -ne 0 ] || { echo "install with failing daemon-reload succeeded unexpectedly" >&2; cat /tmp/install-fail3.log >&2; exit 1; }
          grep -q "installation rolled back" /tmp/install-fail3.log || { echo "forward failure not reported" >&2; cat /tmp/install-fail3.log >&2; exit 1; }
          grep -q "rollback incomplete" /tmp/install-fail3.log || { echo "rollback failure not reported" >&2; cat /tmp/install-fail3.log >&2; exit 1; }
          # The prior unit (canonical listen) must be restored on disk.
          grep -q "127.0.0.1:7336" /etc/systemd/system/webfleet.service || { echo "prior unit not restored after rollback failure" >&2; exit 1; }
          # Re-sync the real systemd manager (the fake could not reload it).
          sudo systemctl daemon-reload
          sudo systemctl enable webfleet.service
          sudo systemctl restart webfleet.service
          wait_healthz
          # Fourth branch: the rollback NEUTRALIZATION (stop) failure is also
          # reported, not discarded. A fake systemctl that fails both `stop`
          # (rollback boundary) and `enable` (forward activation + restore
          # enablement) must surface both failures in the combined error.
          mkdir -p /tmp/fakebin3
          cat > /tmp/fakebin3/systemctl <<'EOF'
          #!/bin/sh
          case "$*" in
            "stop webfleet.service"|"enable webfleet.service") echo "simulated neutralization failure" >&2; exit 1 ;;
            "is-enabled webfleet.service") echo "enabled" ;;
            "is-active webfleet.service") echo "active" ;;
            *) exit 0 ;;
          esac
          EOF
          chmod +x /tmp/fakebin3/systemctl
          set +e
          sudo env "PATH=/tmp/fakebin3:/usr/sbin:/usr/bin:/bin" /tmp/wf service install --listen 127.0.0.1:8091 > /tmp/install-fail4.log 2>&1
          rc=$?
          set -e
          [ "$rc" -ne 0 ] || { echo "install with failing neutralization succeeded unexpectedly" >&2; cat /tmp/install-fail4.log >&2; exit 1; }
          grep -q "rollback incomplete" /tmp/install-fail4.log || { echo "rollback failure marker missing" >&2; cat /tmp/install-fail4.log >&2; exit 1; }
          grep -q "stop failed service" /tmp/install-fail4.log || { echo "rollback stop failure not surfaced" >&2; cat /tmp/install-fail4.log >&2; exit 1; }
          # Re-sync the real systemd manager (the fake could not reload it).
          sudo systemctl daemon-reload
          sudo systemctl enable webfleet.service
          sudo systemctl restart webfleet.service
          wait_healthz